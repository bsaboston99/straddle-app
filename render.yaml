services:
  # ── FastAPI backend ───────────────────────────────────────────────────────
  - type: web
    name: insignia-api
    runtime: python
    rootDir: backend-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets

  # ── React / Vite frontend ─────────────────────────────────────────────────
  - type: web
    name: insignia-app
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://insignia-api-qkex.onrender.com
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Daily alert check cron ────────────────────────────────────────────────
  - type: cron
    name: insignia-alerts
    runtime: python
    rootDir: backend-api
    buildCommand: pip install requests
    schedule: "0 14 * * 1-5"  # 9am ET Mon–Fri (UTC-5)
    startCommand: python -c "import requests; requests.post('https://insignia-api-qkex.onrender.com/alerts/trigger')"

  # ── Daily paper-trading signal check + entry/exit execution ────────────────
  # Same pattern as insignia-alerts above. Runs once a day, near the close,
  # since this strategy trades on daily closes rather than intraday moves.
  # NOTE: fixed UTC offset like the alerts cron above -- doesn't auto-adjust
  # for daylight saving. 20:45 UTC = 3:45pm ET during EDT (most of the year);
  # during EST (~Nov-Mar) that becomes 2:45pm ET. Adjust if that drift matters.
  - type: cron
    name: insignia-paper-trading
    runtime: python
    rootDir: backend-api
    buildCommand: pip install requests
    schedule: "45 20 * * 1-5"
    startCommand: python -c "import requests; requests.post('https://insignia-api-qkex.onrender.com/paper-trading/run-daily-check')"
