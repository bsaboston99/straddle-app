services:
  # ── FastAPI backend ───────────────────────────────────────────────────────
  - type: web
    name: insignia-api
    runtime: python
    rootDir: backend-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: PAPER_TRADING_DB
        value: /var/data/paper_trading.db
    disk:
      # Fixes the ephemeral-disk risk noted in paper_trading.py: without
      # this, a redeploy or restart of insignia-api wipes the trade ledger,
      # since the default web service filesystem isn't persisted. $0.25/mo
      # minimum (1GB) -- paper_trading.db is currently ~24KB, nowhere near
      # a real constraint here. paper_trading.py already reads its db path
      # from PAPER_TRADING_DB (see above), so no code change was needed --
      # just mounting the disk and pointing that env var at it.
      name: paper-trading-data
      mountPath: /var/data
      sizeGB: 1

  # ── React / Vite frontend ─────────────────────────────────────────────────
  - type: web
    name: insignia-app
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://insignia-api-qkex.onrender.com
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Daily alert check cron ────────────────────────────────────────────────
  - type: cron
    name: insignia-alerts
    runtime: python
    rootDir: backend-api
    buildCommand: pip install requests
    schedule: "0 14 * * 1-5"  # 9am ET Mon–Fri (UTC-5)
    startCommand: python -c "import requests; requests.post('https://insignia-api-qkex.onrender.com/alerts/trigger')"

  # ── Continuous paper-trading signal check + entry/exit execution ───────────
  # Polls every 5 minutes, weekdays, 9am-5pm ET only -- no need to run
  # overnight or on weekend mornings, and doing so was adding needless load
  # to insignia-api around the clock. The actual market-hours gate still
  # lives server-side in paper_trading.run_daily_check() (checks Alpaca's
  # own market clock), so this schedule just bounds it to roughly the right
  # window; the 13-21 UTC range below is deliberately widened by an hour on
  # each side to cover both EST (9am ET = 14 UTC) and EDT (9am ET = 13 UTC)
  # without needing to be hand-adjusted at the DST changeover -- the actual
  # 9am-5pm ET cutoff is enforced precisely, every run, by
  # cron_paper_trading_check.py (via zoneinfo), which this startCommand now
  # calls instead of firing the POST directly. Render bills cron jobs per
  # second of actual execution, not by uptime, so the wasted early/late
  # UTC-buffer runs (which exit almost instantly without ever calling
  # insignia-api) cost negligibly more than a perfectly tight window would.
  # The real reason to run this often within the window is catching the
  # model's target-exit level (see paper_trading.py) as soon as it's hit
  # intraday, instead of only once a day and potentially missing a move
  # that reverses before the next check.
  - type: cron
    name: insignia-paper-trading
    runtime: python
    rootDir: backend-api
    buildCommand: pip install requests
    schedule: "*/5 13-21 * * 1-5"
    startCommand: python cron_paper_trading_check.py
